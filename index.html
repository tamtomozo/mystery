<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隠された真実</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dialog.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/board.css">
<script src="js/core/lang.js"></script>
</head>
<body>
<div id="app" class="menu">
  <div id="top">
    <div id="loc" data-l="loc">隠された真実</div>
    <span id="saved" data-l="saved">✓ 保存</span>
    <div id="evcount"></div>
    <button class="btn small" id="langBtn"></button>
    <button class="btn small snd" id="bgmBtn" data-lt="bgm" title="BGMのON/OFF">♪BGM</button>
    <button class="btn small snd" id="seBtn" data-lt="se" title="効果音のON/OFF">SE</button>
    <button class="btn small" id="helpBtn" data-l="help">操作</button>
    <button class="btn gold" id="boardBtn"><span data-l="board">捜査ボード</span></button>
    <button class="btn small gold hidden" id="skip" data-l="skip">スキップ ▶▶</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="bubble" class="hidden"><div id="bname"></div><div id="btext"><span id="btyped"></span><span id="brest"></span></div><div id="bnext">▼</div><div id="btail"></div></div>
    <div id="dlg" class="hidden"><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div><div id="dnext">▼</div></div>
    <div id="toast"></div>
    <div id="band" class="hidden"><div class="strip">
      <div id="bandLabel"></div><div id="bandTitle"></div><div id="bandSub"></div>
      <div id="bandRows"></div><div id="bandNote"></div><div id="bandHint" data-l="bandHint">クリック / Space で閉じる ▼</div>
    </div></div>
    <!-- タイトル -->
    <div id="title" class="overlay">
      <div class="tlogo">
        <div class="tseries" data-l="tseries">HIDDEN TRUTH</div>
        <h1 data-l="title">隠された真実</h1>
        <div class="tline"></div>
        <div class="tsub" data-l="tsub">― 物証が、真実を語る ―</div>
        <div class="tpress" data-l="tpress">クリック / Space で はじめる</div>
        <button class="btn small tcredit hidden" id="creditBtn" data-l="tcredit">スタッフクレジット</button>
      </div>
      <!-- ランディングページへ（行き先の言語は title.js で付ける） -->
      <a class="tabout" id="aboutLink" href="lp/index.html" data-l="tabout">このゲームについて ›</a>
    </div>
    <!-- FILE選択 -->
    <div id="files" class="overlay hidden">
      <div class="fwrap">
        <div class="fhead"><span class="fh" data-l="fh">事件ファイル</span><span class="fen" data-l="fen">FILE SELECT</span></div>
        <div class="fbody">
          <div id="flist"></div>
          <div id="fdetail"></div>
        </div>
        <div class="ffoot">
          <button class="btn small" id="fback" data-l="fback">◀ タイトルへ</button>
          <span class="fhint" data-l="fhint">↑↓ 選ぶ ・ Space / Enter 決定 ・ Esc もどる</span>
        </div>
      </div>
    </div>
    <div id="dial" class="hidden"></div>
    <div id="compare" class="hidden"></div>
    <div id="route" class="hidden"></div>
    <div id="prologue" class="overlay hidden"></div>
    <div id="credits" class="overlay hidden"></div>
    <div id="ending" class="overlay hidden"></div>
    <div id="fade"></div>
  </div>
</div>

<div id="board" class="hidden">
  <div id="bwrap">
    <div class="bhead"><span id="btitle" data-l="btitle">捜査ボード</span><button class="btn small" id="bclose" data-l="bclose">閉じる ✕</button></div>
    <div id="bquote" class="hidden"><span id="bqname">柏木</span><p id="bqtext"></p></div>
    <div class="bbody" id="bbody">
      <section id="hypsec"><p class="sech" data-l="hypsec">推理</p><div id="htabs"></div><div id="hview"></div></section>
      <section id="evsec"><p class="sech"><span data-l="evsec">物証</span> <span id="evnum"></span></p><div id="evgrid"></div><div id="evdetail"></div></section>
    </div>
    <div class="bfoot"><div id="bmsg"></div><div id="bact"></div></div>
  </div>
</div>

<!--
  スクリプトは通常の <script> で順番に読み込む（file:// で直接開いても動くように）。
  すべて同じグローバルスコープを共有するので、読み込み順が大事：
  1. core（定数・音・セーブ・事件の切り替え）
  2. data（common → 事件ごとのフォルダ fileXX/。defCase で登録し、useCase で切り替える） 3. state
     事件データは選んだ言語のものだけを loadCaseData で読み込む（js/core/lang.js。言語の文言 L は <head> で先に読み込む）
  4. ui（会話・ガイド・HUD・タイトル／FILE選択） 5. game（進行・移動・シーン・ボード・取調べ）
  6. render（描画） 7. main（ループ・入力・タイトル。最後に読み込む）
-->
<script src="js/core/config.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/case.js"></script>
<script src="js/data/common.js"></script>
<script>loadCaseData(['file01','file02','file03','file04','file05','file06','file07','file08','file09']);</script>
<script src="js/core/state.js"></script>
<script src="js/data/files.js"></script>
<script src="js/ui/dialog.js"></script>
<script src="js/ui/guides.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/ui/prologue.js"></script>
<script src="js/ui/dial.js"></script>
<script src="js/ui/compare.js"></script>
<script src="js/ui/route.js"></script>
<script src="js/ui/credits.js"></script>
<script src="js/game/progress.js"></script>
<script src="js/game/player.js"></script>
<script src="js/game/scene.js"></script>
<script src="js/game/board.js"></script>
<script src="js/game/interrogation.js"></script>
<script src="js/render/draw-util.js"></script>
<script src="js/render/backgrounds.js"></script>
<script src="js/render/bg-file02.js"></script>
<script src="js/render/bg-file03.js"></script>
<script src="js/render/bg-file04.js"></script>
<script src="js/render/bg-file05.js"></script>
<script src="js/render/bg-file06.js"></script>
<script src="js/render/bg-file07.js"></script>
<script src="js/render/bg-file08.js"></script>
<script src="js/render/bg-file09.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
